# Ed switches Pages Source to Actions only after this is reviewed/green and released.
# repository_dispatch runs from default main even though gh-pages has no workflow files.
name: Publish Pages snapshot
on:
  repository_dispatch:
    types: [pages-live, pages-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
    steps:
      # No environment/deploy approval is requested while Ed still uses legacy Pages.
      - name: Read the manually selected Pages source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getPages(context.repo);
            core.setOutput('enabled', data.build_type === 'workflow' ? 'true' : 'false');
            if (data.build_type !== 'workflow') core.notice('Pages is still legacy. Ed will switch Source to Actions after review; no settings changed.');
  debounce:
    needs: [source]
    if: needs.source.outputs.enabled == 'true' && github.event_name == 'repository_dispatch' && github.event.action == 'pages-preview'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-preview-debounce
      cancel-in-progress: true
    steps:
      # Outside the publisher lock: a live request never waits for this sleep.
      - run: sleep 60
  publish:
    needs: [source, debounce]
    if: ${{ !cancelled() && needs.source.outputs.enabled == 'true' && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-snapshot-publisher
      # Finish the running publication. GitHub keeps only the newest pending job.
      # Whichever request wins that slot checks out latest gh-pages AFTER acquiring
      # this lock, so preview churn cannot keep a newly committed live root out.
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the latest complete site including live root
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Record publication boundary
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const {publicationPolicy,publicationSnapshot}=require('./tools/ci/pages-policy.cjs');
            const policy=publicationPolicy(context.eventName,context.payload.action);
            const sha=cp.execFileSync('git',['-C','site','rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const rootVersion=JSON.parse(fs.readFileSync('site/version.json','utf8')).version;
            const evidence={...publicationSnapshot(context.payload.client_payload??{}, {sha,rootVersion}),policy,startedAt:new Date().toISOString(),requestAt:context.payload.client_payload?.requested_at??null};
            fs.writeFileSync('pages-publication.json',JSON.stringify(evidence,null,2));
            core.info(`Publishing latest site ${sha}, LIVE root ${rootVersion}; ${policy.kind} request`);
      # The coordinator, 2026-11-09 (release 17 sat unpublished ~50 min): one deployment timed out in Pages' "syncing
      # files" (the snapshot is ~1 GB), the next was cancelled, and a re-run failed on two artifacts of one name. So:
      # one artifact name per attempt (a re-run can deploy again), a longer timeout, one retry in the job, and a check
      # that the public site serves the root this job published.
      - name: Package complete site snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # deploy-pages names a deployment by GITHUB_SHA, and every publication between two main commits runs at the same
      # SHA: a later one was then reported "succeed" from the earlier deployment's status while the public site kept
      # the earlier snapshot (2026-11-10: v7765 on gh-pages, v7756 public). So each attempt gets its own build version.
      - name: Deploy complete snapshot
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
      - name: Deploy again after a failed or cancelled deployment
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-retry
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
      - name: Check the public site serves the published live root
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
        with:
          script: |
            const fs=require('fs'),e=JSON.parse(fs.readFileSync('pages-publication.json','utf8'));
            const num=v=>Number(String(v).match(/v(\d+)/)?.[1]??NaN), want=num(e.rootVersion);
            const base=(process.env.PAGE_URL||`https://${context.repo.owner}.github.io/${context.repo.repo}/`).replace(/\/?$/,'/');
            let seen='';
            for(let i=0;i<40;i++){ // up to ~10 minutes: Pages' CDN can lag the deployment
              try{const r=await fetch(`${base}version.json?publication=${Date.now()}`,{cache:'no-store'});seen=(await r.json()).version;}catch(err){seen=`unreadable (${err.message})`;}
              // (a newer root is fine: a later publication may already have overtaken this one)
              if(num(seen)>=want){core.info(`Public root ${seen}; published ${e.rootVersion}`);return;}
              await new Promise(r=>setTimeout(r,15000));
            }
            core.setFailed(`The public site still serves ${seen}, not ${e.rootVersion}. Re-run this workflow (Actions → Publish Pages snapshot → Run workflow).`);
      - name: Record publication completion
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),file='pages-publication.json',e=JSON.parse(fs.readFileSync(file,'utf8'));
            e.completedAt=new Date().toISOString();
            e.requestToDeployMs=e.requestAt?Date.parse(e.completedAt)-Date.parse(e.requestAt):null;
            fs.writeFileSync(file,JSON.stringify(e,null,2));
            await core.summary.addHeading('Pages snapshot published').addRaw(`Site ${e.sha}; LIVE root ${e.rootVersion}; request-to-deploy ${e.requestToDeployMs??'manual'} ms. Canonical still verifies public version.json.`).write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-publication-evidence
          path: pages-publication.json
          if-no-files-found: ignore
