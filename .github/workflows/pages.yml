# Playable links on GitHub Pages, served from the gh-pages branch:
# main at the site's root, each pull request under /pr-<number>/ (removed when the PR closes).
name: Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
concurrency:
  group: pages-${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  pull-requests: write
jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The start screen's "Coming up": the other open pull requests (title and the first plain
      # line of each description), newest activity first, baked into this build (vite.config.ts).
      - name: List the work in flight
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo, self = context.payload.pull_request?.number;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            const plain = s => s.replace(/<!--.*?-->/g, "").replace(/\*\*|__|`/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/^[-*>]\s+/, "").trim();
            const firstLine = body => (body || "").split("\n").map(plain).find(l => l && !/^(#|\||---|🤖|https?:)/.test(l)) || "";
            const cut = (s, n) => (s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, "") + "…" : s);
            const items = prs.filter(p => p.number !== self && p.base.ref !== "main") // not the round roll-ups into main
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)).slice(0, 8)
              .map(p => ({ number: p.number, title: p.title, summary: cut(firstLine(p.body), 140) }));
            fs.writeFileSync("upcoming.generated.json", JSON.stringify(items));
            core.info(`${items.length} items in flight`);
      - run: npm run build
        env:
          WITCH_VERSION: ${{ github.run_number }}
          WITCH_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
          keep_files: true
          commit_message: "Deploy ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || 'main' }} at ${{ github.sha }}"
      - name: Comment the playable link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- witch-playable-link -->";
            const { owner, repo } = context.repo, number = context.issue.number;
            const url = `https://${owner}.github.io/${repo}/pr-${number}/`;
            const body = `${marker}\nPlayable link for this PR: ${url}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)} (v${context.runNumber}); the version shows bottom right in the game. Add \`?seed=123\` to play a given map. It goes live a minute or two after this comment, once GitHub Pages has published it.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
  remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove this PR's build
        run: |
          dir="pr-${{ github.event.number }}"
          if [ -d "$dir" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "$dir"
            git commit -m "Remove $dir: PR closed"
            git push
          fi
