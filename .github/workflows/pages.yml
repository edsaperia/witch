# Playable links on GitHub Pages, served from the gh-pages branch:
# main at the site's root, each pull request under /pr-<number>/ (removed when the PR closes).
name: Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
concurrency:
  group: pages-${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
  pull-requests: write
jobs:
  deploy:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
          keep_files: true
          commit_message: "Deploy ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || 'main' }} at ${{ github.sha }}"
      - name: Comment the playable link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- witch-playable-link -->";
            const { owner, repo } = context.repo, number = context.issue.number;
            const url = `https://${owner}.github.io/${repo}/pr-${number}/`;
            const body = `${marker}\nPlayable link for this PR: ${url}\n\nBuilt from ${context.sha.slice(0, 7)}. Add \`?seed=123\` to play a given map. It goes live a minute or two after this comment, once GitHub Pages has published it.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
  remove:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove this PR's build
        run: |
          dir="pr-${{ github.event.number }}"
          if [ -d "$dir" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq "$dir"
            git commit -m "Remove $dir: PR closed"
            git push
          fi
