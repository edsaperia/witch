# Checks on every push and pull request: the tests, the type check and the build; then a quick
# smoke test of the built game in headless Chromium (tools/smoke/quick.cjs, a few minutes).
name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Playwright isn't one of the game's dependencies: installed on its own, with its Chromium
      # cached between runs (the system libraries it needs are installed every time).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - run: .pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Quick smoke test
        shell: bash
        run: |
          mkdir -p quick
          NODE_PATH=$PWD/.pw/node_modules QUICK_OUT=quick/quick.png node tools/smoke/quick.cjs 2>&1 | tee quick/log.txt
      # The music: the Music Lab builds (esbuild, from the game's dependencies) and every section
      # renders offline in headless Chromium, none silent or clipping (tools/music-lab/check.cjs).
      - run: npm ci
      - name: Music check
        run: NODE_PATH=$PWD/.pw/node_modules node tools/music-lab/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-quick
          path: quick
          retention-days: 14
