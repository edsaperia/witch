# The art check (node art/check.mjs: every creature, tree, area and piece of the art drawn and measured in headless Chromium)
# at the pull request, so a red is caught there and not later on claude/prototype (the coordinator, 2026-10-13). On a pull
# request that touches only creature and area folders (art/creatures/<id>/, art/areas/<id>/) it runs just their checks
# (--only, about a minute); shared art code, the Art Lab, the style file or the check itself mean the full run (about 40
# minutes on a runner, the sprite checks dealt out over its cores); a change with nothing of the art in it is skipped
# (tools/art-check/scope.mjs says which). Every push to claude/prototype gets the full run. Its own check, never required,
# until it has proven steady; the log and the silhouette sheet are the run's art-check artifact.
name: Art check
on:
  push:
    branches: [claude/prototype]
  pull_request:
    paths:
      - "art/**"
      - "tools/art-lab/**"
      - "tools/art-check/**"
      - "config/style.json"
      - ".github/workflows/art-check.yml"
concurrency:
  group: art-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  art:
    name: art check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # What to run: the paths the pull request changes, against its base (the push to prototype runs it all).
      - name: Scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > changed.txt
            FLAGS=$(node tools/art-check/scope.mjs --file changed.txt)
          else
            FLAGS=""
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "art check: ${FLAGS:-the full run}"
      # Playwright isn't one of the game's dependencies: installed on its own, its Chromium cached between runs (as ci.yml).
      - if: steps.scope.outputs.flags != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.flags != 'skip'
        run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.flags != 'skip'
        run: .pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Art check
        if: steps.scope.outputs.flags != 'skip'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          NODE_PATH=$PWD/.pw/node_modules node art/check.mjs ${{ steps.scope.outputs.flags }} --times 2>&1 | tee out/log.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.flags != 'skip'
        with:
          name: art-check
          path: |
            out/log.txt
            art/out/silhouettes.png
          retention-days: 14
          if-no-files-found: ignore
