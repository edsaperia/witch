# Ordinary PRs reuse successful named-task results by source/dependency/environment
# fingerprint. Missing results run; unknown dependency layouts run the full check.
# Release PRs use the same exact fingerprints. Shared pushes can reuse a proven identical checked tree.
name: Art check
on:
  push:
    branches: [claude/prototype, main]
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: art-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  art:
    name: art check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Find an already checked identical tree
        id: checked
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), cp = require('child_process');
            const { pathToFileURL } = require('url');
            const { findPassedTree } = await import(pathToFileURL(path.resolve('tools/art-check/checked-tree.mjs')).href);
            const tree = cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();
            const environment = {node:cp.execFileSync('node',['-p','process.version'],{encoding:'utf8'}).trim(), os:process.env.RUNNER_OS, arch:process.arch, browser:process.env.PLAYWRIGHT_VERSION};
            const {owner, repo} = context.repo;
            const run = await findPassedTree({github, owner, repo, tree, environment, currentRun:context.runId, info:core.info,
              readProof: async artifact => {
                const zip = path.join(process.env.RUNNER_TEMP, `art-proof-${artifact.id}.zip`);
                const {data} = await github.rest.actions.downloadArtifact({owner, repo, artifact_id:artifact.id, archive_format:'zip'});
                fs.writeFileSync(zip, Buffer.from(data));
                try { return JSON.parse(cp.execFileSync('unzip', ['-p', zip, 'art-check-proof.json'], {encoding:'utf8', maxBuffer:65536})); }
                finally { fs.unlinkSync(zip); }
              }});
            core.setOutput('run', run ?? '');
            if (run) core.info(`Exact checked tree ${tree}: reusing successful Art check run ${run}`);
      - run: npm ci
        if: steps.checked.outputs.run == ''
      - name: Restore successful PR art checks
        if: steps.checked.outputs.run == ''
        uses: actions/cache@v4
        with:
          path: .art-check-results
          key: art-results-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: art-results-v1-${{ runner.os }}-
      # Every missed result runs; unknown dependency layouts fall back to full coverage.
      - name: Scope
        id: scope
        shell: bash
        env:
          CHECKED_RUN: ${{ steps.checked.outputs.run }}
        run: |
          set -o pipefail
          if [ -n "$CHECKED_RUN" ]; then MODE="skip"; else
            MODE=$(node tools/art-check/affected.mjs --plan out/art-check-plan.json | tail -n 1)
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "art check: $MODE"
      # Playwright isn't one of the game's dependencies: installed on its own, its Chromium cached between runs (as ci.yml).
      - if: steps.scope.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.mode != 'skip'
        run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.mode != 'skip'
        run: .pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Art check
        if: steps.scope.outputs.mode != 'skip'
        shell: bash
        env:
          CHECK_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -o pipefail
          mkdir -p out
          if [ "$CHECK_MODE" = "full" ]; then
            NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node art/check.mjs --times 2>&1 | tee out/log.txt
          else
            NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node tools/art-check/affected.mjs --run out/art-check-plan.json 2>&1 | tee out/log.txt
          fi
      - name: Record the exact successful checked tree
        if: success()
        run: |
          mkdir -p out
          node --input-type=module -e 'import fs from "node:fs"; import cp from "node:child_process"; fs.writeFileSync("out/art-check-proof.json", JSON.stringify({schema:1,tree:cp.execFileSync("git",["rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim(),runId:Number(process.env.GITHUB_RUN_ID),environment:{node:process.version,os:process.env.RUNNER_OS,arch:process.arch,browser:process.env.PLAYWRIGHT_VERSION}}));'
      - name: Save exact checked-tree proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: art-check-tree
          path: out/art-check-proof.json
          retention-days: 14
          if-no-files-found: error
      - name: Failure annotation totals
        if: always()
        run: node tools/ci/annotations.cjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-check
          path: |
            out/log.txt
            out/art-check-plan.json
            art/out/silhouettes.png
          retention-days: 14
          if-no-files-found: ignore
