# Ordinary PRs reuse successful named-task results by source/dependency/environment
# fingerprint. Missing results run; unknown dependency layouts run the full check.
# Prototype/main pushes and release-check PRs always run the full uncached command.
name: Art check
on:
  push:
    branches: [claude/prototype, main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: art-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  art:
    name: art check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore successful PR art checks
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'claude/rel-') && !startsWith(github.event.pull_request.title, 'Release check:')
        uses: actions/cache@v4
        with:
          path: .art-check-results
          key: art-results-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: art-results-v1-${{ runner.os }}-
      # Match successful input hashes on ordinary PRs; shared pushes/releases run all.
      - name: Scope
        id: scope
        shell: bash
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BRANCH: ${{ github.head_ref }}
          CHECK_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$CHECK_EVENT" = "pull_request" ] && [[ "$CHECK_BRANCH" != claude/rel-* ]] && [[ "$CHECK_TITLE" != 'Release check:'* ]]; then
            MODE=$(node tools/art-check/affected.mjs --plan out/art-check-plan.json | tail -n 1)
          else
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "art check: $MODE"
      # Playwright isn't one of the game's dependencies: installed on its own, its Chromium cached between runs (as ci.yml).
      - if: steps.scope.outputs.mode != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.mode != 'skip'
        run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.scope.outputs.mode != 'skip'
        run: .pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Art check
        if: steps.scope.outputs.mode != 'skip'
        shell: bash
        env:
          CHECK_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -o pipefail
          mkdir -p out
          if [ "$CHECK_MODE" = "full" ]; then
            NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node art/check.mjs --times 2>&1 | tee out/log.txt
          else
            NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node tools/art-check/affected.mjs --run out/art-check-plan.json 2>&1 | tee out/log.txt
          fi
      - name: Failure annotation totals
        if: always()
        run: node tools/ci/annotations.cjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-check
          path: |
            out/log.txt
            out/art-check-plan.json
            art/out/silhouettes.png
          retention-days: 14
          if-no-files-found: ignore
