# Advisory art: the full check nightly on prototype or on a manual ref; on a pull request, only what it changed.
# No build, deploy or release waits on it (Ed, 2026-11-01: "I don't think art checks should hold up a build"): its
# own workflow, so CI's run ends without it. Three shards retain every named task and the atomic auxiliary/lab unit.
# Pull requests (Ed, 2026-11-12, #1975 question 5: "(b) also run a narrowed art check on PRs that touch art"): the plan
# job's first step reads the PR's changed files against its base. config/checks.json's art-check paths say whether it
# needs the art check (tools/checks/which.mjs) and tools/art-check/scope.mjs how much: none skips at once; creature and
# area folders alone run `--only <ids> --no-lab` in the narrowed job; shared art code takes the full path below, its
# fingerprint cache running only the tasks whose inputs changed. A release PR is narrowed over its whole diff (the art
# all its PRs changed, combined); a publish PR (prototype into main) carries releases already checked, and skips.
name: Art check
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
concurrency:
  group: art-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  plan:
    name: art plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      # skip or only (a pull request's narrowing), else the full path's: exact, cached, affected or full
      mode: ${{ steps.narrow.outputs.scope != 'full' && steps.narrow.outputs.scope || steps.scope.outputs.mode }}
      flags: ${{ steps.narrow.outputs.flags }}
      shards: ${{ steps.scope.outputs.shards }}
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - name: Resolve the exact art source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.eventName === 'schedule' ? 'claude/prototype' : context.sha;
            const {data} = await github.rest.repos.getCommit({...context.repo, ref});
            core.setOutput('sha', data.sha);
            core.info(`Art source: ${ref} at ${data.sha}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          # A pull request's source is GitHub's merge of it into its base's tip: the first parent is that tip.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Narrow a pull request to the art it changes
        id: narrow
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |-
          set -euo pipefail
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          out() { echo "scope=$1" >> "$GITHUB_OUTPUT"; echo "flags=$2" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != pull_request ]; then out full ""; exit 0; fi
          if [ "$PR_BRANCH" = claude/publish-snapshot ] || [[ "$PR_TITLE" == Publish:* ]]; then
            say "Art check skipped: a publish pull request carries releases whose art their release pull requests checked."; out skip skip; exit 0
          fi
          if [ "$(git rev-parse -q --verify 'HEAD^2' || true)" != "$PR_HEAD" ]; then
            say "Art check: the full check (the source is not GitHub's merge of $PR_HEAD, so its changes are unknown)."; out full ""; exit 0
          fi
          node tools/checks/which.mjs --base HEAD^1 --json > "$RUNNER_TEMP/art-scope.json"
          check=$(jq -c '[.builder[], .coordinator[]] | map(select(.id == "art-check"))[0] // empty' "$RUNNER_TEMP/art-scope.json")
          if [ -z "$check" ]; then
            say "Art check skipped: this pull request changes none of config/checks.json's art-check paths."; out skip skip; exit 0
          fi
          command=$(jq -r .command <<<"$check"); files=$(jq -r '.files | (.[:12] | map("`" + . + "`") | join(", ")) + (if length > 12 then " and \(length - 12) more" else "" end)' <<<"$check")
          flags=${command#node art/check.mjs}; flags=${flags# }
          if [[ "$flags" =~ ^--only\ [a-z0-9_,-]+\ --no-lab$ ]]; then
            say "Art check narrowed: \`$command\`, for $files."; out only "$flags"
          else
            say "Art check: the full check (shared art code changed: $files); the fingerprint cache runs only tasks whose inputs changed."; out full ""
          fi
      - name: Find an already checked identical tree
        id: checked
        if: steps.narrow.outputs.scope == 'full'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), cp = require('child_process');
            const { pathToFileURL } = require('url');
            const { findPassedTree, proofMatches } = await import(pathToFileURL(path.resolve('tools/art-check/checked-tree.mjs')).href);
            const tree = cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();
            const environment = {node:cp.execFileSync('node',['-p','process.version'],{encoding:'utf8'}).trim(), os:process.env.RUNNER_OS, arch:process.arch, browser:process.env.PLAYWRIGHT_VERSION};
            const {owner, repo} = context.repo;
            const proofs = new Map();
            const readProof = async artifact => {
                const zip = path.join(process.env.RUNNER_TEMP, `art-proof-${artifact.id}.zip`);
                const {data} = await github.rest.actions.downloadArtifact({owner, repo, artifact_id:artifact.id, archive_format:'zip'});
                fs.writeFileSync(zip, Buffer.from(data));
                try { const proof=JSON.parse(cp.execFileSync('unzip', ['-p', zip, 'art-check-proof.json'], {encoding:'utf8', maxBuffer:65536})); proofs.set(proof.runId,proof); return proof; }
                finally { fs.unlinkSync(zip); }
              };
            let run = await findPassedTree({github, owner, repo, tree, environment, currentRun:context.runId, info:core.info, readProof});
            // Scheduled run metadata names the default-branch workflow SHA, not the prototype checkout.
            // Its successful proof, rather than that metadata SHA, must establish the actual checked tree.
            if (!run) {
              try {
              const {data} = await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'art-check.yml',status:'success',per_page:100});
              for (const prior of data.workflow_runs) {
                if (prior.id === context.runId || prior.conclusion !== 'success' || prior.head_repository?.full_name !== `${owner}/${repo}` || !['schedule','workflow_dispatch'].includes(prior.event)) continue;
                const {data:artifacts} = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:prior.id,per_page:100});
                for (const a of artifacts.artifacts.filter(a=>a.name === 'art-check-tree' && !a.expired && a.size_in_bytes <= 1048576)) {
                  try { if (proofMatches(await readProof(a),tree,environment,prior.id)) { run=prior.id; break; } }
                  catch(error) { core.info(`Proof unavailable; checking art: ${String(error)}`); }
                }
                if (run) break;
              }
              } catch(error) { core.info(`Scheduled proof lookup unavailable; checking art: ${String(error)}`); }
            }
            core.setOutput('run', run ?? '');
            if (run) { fs.mkdirSync("out",{recursive:true}); fs.writeFileSync("out/exact-proof.json",JSON.stringify(proofs.get(run))); core.info(`Exact checked tree ${tree}: reusing successful Art check run ${run}`); }
      - run: npm ci
        if: steps.narrow.outputs.scope == 'full' && steps.checked.outputs.run == ''
      - name: Restore successful PR art checks
        if: steps.narrow.outputs.scope == 'full' && steps.checked.outputs.run == ''
        uses: actions/cache/restore@v4
        with:
          path: .art-check-results
          key: art-results-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: art-results-v1-${{ runner.os }}-
      - name: Import successful PR task results into the existing cache
        if: steps.narrow.outputs.scope == 'full' && steps.checked.outputs.run == ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), cp = require('child_process');
            const {pathToFileURL} = require('url');
            const {importPassedResults} = await import(pathToFileURL(path.resolve('tools/art-check/checked-tree.mjs')).href);
            const environment = {node:cp.execFileSync('node',['-p','process.version'],{encoding:'utf8'}).trim(),os:process.env.RUNNER_OS,arch:process.arch,browser:process.env.PLAYWRIGHT_VERSION};
            const {owner,repo} = context.repo;
            const count = await importPassedResults({github,owner,repo,environment,currentRun:context.runId,info:core.info,
              saveResult: result => { fs.mkdirSync('.art-check-results',{recursive:true}); fs.writeFileSync(path.join('.art-check-results',`${result.key}.json`),JSON.stringify({schema:1,id:result.id,key:result.key,passed:true})); },
              readProof: async artifact => {
                if (artifact.size_in_bytes > 1048576) throw Error('Oversized task proof');
                const zip = path.join(process.env.RUNNER_TEMP,`task-proof-${artifact.id}.zip`);
                const {data} = await github.rest.actions.downloadArtifact({owner,repo,artifact_id:artifact.id,archive_format:'zip'});
                fs.writeFileSync(zip,Buffer.from(data));
                try { return JSON.parse(cp.execFileSync('unzip',['-p',zip,'art-check-proof.json'],{encoding:'utf8',maxBuffer:1048576})); }
                finally { fs.unlinkSync(zip); }
              }});
            core.info(`Imported ${count} successful task results; current fingerprints still decide every hit`);
      - name: Prepare the complete shard plan
        id: scope
        if: steps.narrow.outputs.scope == 'full'
        shell: bash
        env:
          CHECKED_RUN: ${{ steps.checked.outputs.run }}
        run: |-
          set -o pipefail
          mkdir -p out
          if [ -n "$CHECKED_RUN" ]; then
            node -e 'require("fs").writeFileSync("out/art-check-plan.json",JSON.stringify({schema:1}));'
          else
            node tools/art-check/affected.mjs --plan out/art-check-plan.json 2>&1 | tee out/planning.log
          fi
          node tools/art-check/shards.mjs prepare out/art-check-plan.json
      - uses: actions/upload-artifact@v4
        if: steps.narrow.outputs.scope == 'full'
        with:
          name: art-check-plan
          path: out/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
  # A pull request's creature and area folders alone (tools/art-check/scope.mjs's `--only <ids> --no-lab`): their own
  # checks, on one runner. The art check needs no npm packages, only Playwright's Chromium.
  narrowed:
    name: art check (${{ needs.plan.outputs.flags }})
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium (bounded, one retry)
        shell: bash
        run: node tools/ci/install-chromium.cjs
      - name: Run the art check on the changed creatures and areas
        shell: bash
        env:
          FLAGS: ${{ needs.plan.outputs.flags }}
        run: |-
          set -f -o pipefail
          mkdir -p out
          [[ "$FLAGS" =~ ^--only\ [a-z0-9_,-]+\ --no-lab$ ]] || { echo "::error::Unexpected art check flags: $FLAGS"; exit 1; }
          NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node art/check.mjs $FLAGS --times 2>&1 | tee out/log.txt
      - name: The art check's report
        if: always()
        shell: bash
        env:
          FLAGS: ${{ needs.plan.outputs.flags }}
        run: |-
          [ -f out/log.txt ] || exit 0
          { echo "### node art/check.mjs $FLAGS"; echo; echo '```'
            grep -E '^(FAIL|WARN)|check\(s\) failed$|^all checks passed$|^passes: ' out/log.txt | cut -c1-600 | head -40
            echo '```'; echo; echo "The whole report is the run's art-check-narrowed artifact."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Failure annotation totals
        if: always()
        run: node tools/ci/annotations.cjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-check-narrowed
          path: |-
            out/log.txt
            art/out/silhouettes.png
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  shards:
    name: art shard ${{ matrix.shard }}
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'affected' || needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: art-check-plan
          path: out
      - name: Determine whether this shard needs a browser
        id: browser
        run: node tools/art-check/shards.mjs needs-browser out/art-check-plan.json ${{ matrix.shard }}
      - if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.browser.outputs.needed == 'true'
        run: npm install --prefix .pw --no-save --no-package-lock playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium (bounded, one retry)
        if: steps.browser.outputs.needed == 'true'
        shell: bash
        run: node tools/ci/install-chromium.cjs
      - name: Run assigned art coverage
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |-
          set -o pipefail
          mkdir -p out
          NODE_PATH=$PWD/.pw/node_modules node tools/ci/report-command.cjs --kind art -- node tools/art-check/shards.mjs run out/art-check-plan.json "$SHARD" 2>&1 | tee "out/log-$SHARD.txt"
      - name: Save successful shard proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: art-shard-proof-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Failure annotation totals
        if: always()
        run: node tools/ci/annotations.cjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-check-shard-${{ matrix.shard }}
          path: |-
            out/log-${{ matrix.shard }}.txt
            art/out/silhouettes.png
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
  art:
    name: art check
    needs:
      - plan
      - shards
    # (a pull request that skips, or runs only the narrowed job, has no full-path coverage to prove)
    if: ${{ always() && needs.plan.outputs.mode != 'skip' && needs.plan.outputs.mode != 'only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
        if: ${{ always() && needs.plan.outputs.sha != '' }}
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: ${{ always() && needs.plan.outputs.sha != '' }}
      - name: Require successful planning and every needed shard
        if: always()
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |-
          set -euo pipefail
          test "$PLAN_RESULT" = success
          case "$MODE" in
            affected|full) test "$SHARDS_RESULT" = success ;;
            exact|cached) test "$SHARDS_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
      - run: npm ci
        if: ${{ success() && needs.plan.outputs.mode != 'exact' }}
      - uses: actions/download-artifact@v4
        if: ${{ always() && needs.plan.result == 'success' }}
        with:
          name: art-check-plan
          path: out
      - uses: actions/download-artifact@v4
        if: ${{ always() && (needs.plan.outputs.mode == 'affected' || needs.plan.outputs.mode == 'full') }}
        continue-on-error: true
        with:
          pattern: art-shard-proof-*
          merge-multiple: true
          path: out/shards
      - name: Validate complete coverage and combine proof
        shell: bash
        env:
          SHARD_STATUS: ${{ needs.shards.result }}
          EXPECTED_MODE: ${{ needs.plan.outputs.mode }}
        run: |-
          set -o pipefail
          node tools/art-check/shards.mjs combine out/art-check-plan.json 2>&1 | tee out/combine.log
      - name: Save exact checked-tree proof
        uses: actions/upload-artifact@v4
        with:
          name: art-check-tree
          path: out/art-check-proof.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Seed the existing result cache from combined proof
        id: records
        run: node -e 'const f=require("fs"),p=JSON.parse(f.readFileSync("out/art-check-proof.json"));f.mkdirSync(".art-check-results",{recursive:true});for(const r of p.results){if(r.schema!==1||r.passed!==true||!(/^[a-f0-9]{64}$/).test(r.key))throw Error("Invalid result");f.writeFileSync(".art-check-results/"+r.key+".json",JSON.stringify(r));}f.appendFileSync(process.env.GITHUB_OUTPUT,"count="+p.results.length+"\n");'
      - uses: actions/cache/save@v4
        if: ${{ success() && steps.records.outputs.count != '0' }}
        with:
          path: .art-check-results
          key: art-results-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        if: ${{ always() && (needs.plan.outputs.mode == 'affected' || needs.plan.outputs.mode == 'full') }}
        continue-on-error: true
        with:
          pattern: art-check-shard-*
          path: out/shard-logs
      - name: Collect diagnostic logs
        if: ${{ always() && needs.plan.outputs.sha != '' }}
        shell: bash
        run: |-
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=[];function walk(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())walk(p);else if(p.endsWith('.txt'))files.push(p);}}
          walk('out/shard-logs');let log='';for(const p of [...files.sort(),'out/planning.log','out/combine.log'])try{log+='\n--- '+p+' ---\n'+fs.readFileSync(p,'utf8');}catch{}
          fs.mkdirSync('out',{recursive:true});fs.writeFileSync('out/log.txt',log);
          NODE
      - name: Failure annotation totals
        if: ${{ always() && needs.plan.outputs.sha != '' }}
        run: node tools/ci/annotations.cjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-check
          path: |-
            out/log.txt
            out/art-check-plan.json
            out/planning.log
            out/combine.log
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - name: Update the single nightly art result on issue 1476
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
        uses: actions/github-script@v7
        env:
          ART_RESULT: ${{ job.status }}
          ART_SOURCE: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- witch-art-check-nightly-result -->';
            const {owner, repo} = context.repo, issue_number = 1476;
            const prior = (await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page:100}))
              .find(c => c.body?.includes(marker) && c.user?.login === 'github-actions[bot]');
            const success = process.env.ART_RESULT === 'success';
            if (success && !prior) return; // Quiet passing nights; recover the same standing failure comment.
            let log = ''; try { log = fs.readFileSync('out/log.txt', 'utf8'); } catch {}
            const batches = [...log.matchAll(/^checking art: (.+)$/gm)].map(m => m[1]);
            const failures = log.split('\n').filter(l => /^FAIL\b|Error:|::error/.test(l)).slice(0,12);
            const source = process.env.ART_SOURCE || 'unresolved (source lookup failed)';
            const run = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let plan=null; try { plan=JSON.parse(fs.readFileSync('out/art-check-plan.json','utf8')); } catch {}
            const missing=plan && ['affected','full'].includes(plan.mode) ? Array.from({length:plan.shardCount},(_,i)=>i).filter(i=>!fs.existsSync('out/shards/shard-'+i+'.json')) : [];
            const tasks=missing.length ? 'Failed/unproven shard coverage: '+missing.join(', ')+'. See per-shard logs; no individual task is inferred to have failed.'
              : 'Setup, art coverage, proof aggregation or artifact handling was not successful. See logs; batch attribution is conservative.';
            const body = `${marker}\nREPORT: Nightly art ${success ? 'RECOVERED / PASS' : 'FAILED'} on claude/prototype SHA ${source}.\n\n${success ? 'The latest complete check passed; the preceding failure is resolved.' : tasks}\n\n${success ? '' : failures.join('\n').slice(0,4000)}\n\nRun: ${run}\nUpdated ${new Date().toISOString()}. Art is advisory; build, deploy and release do not wait for it.`;
            if (prior) await github.rest.issues.updateComment({owner,repo,comment_id:prior.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
