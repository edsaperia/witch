<script>

// x east, z south (up the screen is north, as in the game). Everything is one shape (rooms and branches smooth-unioned, no seams),

const PPM = 32 / 3;

  { id: "dining", label: "Dining Room", x: -8, z: 34, r: 14, side: -1 },
  { id: "terrace", label: "Terrace", x: 10, z: 8, r: 12.5, side: 1 },
  { id: "parlour", label: "Parlour", x: -6, z: -16, r: 11, side: -1 },

  { id: "workshop", label: "Workshop", from: "dining", x: -40, z: 20, r: 8, bend: .5 },

  ["teaTable", "dining", -21, 20, 2.8, 2.8, "Tea table"], ["cardTable", "dining", -9, 26, 3.4, 3.4, "Card table"],
  ["cauldron", "kitchen", -41, 18, 2.8, 2.8, "Cauldron"],

  ["mirror", "cloakroom", -27.5, -9.5, 2.2, 0.6, "Hat mirror"], ["hats", "cloakroom", -24, -5, 3.6, 1.8, "Hats' floor"], ["cloakPegs", "cloakroom", -29.5, -4, 0.6, 2.6, "Cloak pegs"],
  ["bags", "parlour", 3, -27, 3.6, 0.8, "Bags"], ["invitations", "parlour", 10, -26, 3.4, 1.8, "Invitations desk"],
  ["book", "bestiary", 30, -29.5, 1.6, 1.2, "Bestiary book"], ["specimens", "bestiary", 35, -26, 0.8, 5, "Specimens"],
  ["mapTable", "solarium", -19, -27, 2.6, 2.6, "Map table"],
  ["telephone", "boudoir", -6, -44, 1, 1, "Telephone"],
  ["bed", "bedroom", 10, -60, 4, 5.2, "Bed"], ["wardrobe", "bedroom", 1.5, -59, 1.2, 4, "Wardrobe"], ["dressingTable", "bedroom", 5, -62.5, 2.8, 1.2, "Dressing table"],
  ["shoeRack", "bedroom", 2.5, -53.5, 3, 1.1, "Shoe rack"], ["clothesPile", "bedroom", 9.5, -55, 1.6, 2, "Clothes pile"],
  ["telescope", "turret", 24.5, -69, 1.6, 1.6, "Telescope"],

const OLD = { dining: [-15, 22, 12], kitchen: [-40, 18, 6], workshop: [-30, 46, 7], terrace: [0, 0, 10.5], studio: [27, -6, 6.5], cloakroom: [-25, -6, 5.5],
  parlour: [7, -22, 9], bestiary: [31, -27, 6], solarium: [-19, -27, 6], boudoir: [-3, -41, 7.5], bedroom: [7, -57, 7], turret: [24, -68, 4.5] };
// the Terrace's furniture placed afresh: its decks and records on its open east rim, the circle in its middle
const TERRACE_AT = { decks: [6, 8], recordShelf: [0, 9.5], circle: [-1, -2] };
for (const o of OBJ) { const [id, room, x, z] = o, R = TRUNK.concat(BRANCH).find(q => q.id === room), q = OLD[room];
  if (room === "terrace" && TERRACE_AT[id]) { o[2] = R.x + TERRACE_AT[id][0]; o[3] = R.z + TERRACE_AT[id][1]; continue; }
  const k = R.r / q[2]; o[2] = R.x + (x - q[0]) * k; o[3] = R.z + (z - q[1]) * k; }
const TAKEOFF = { x: 10 + 12.5 * Math.cos(1.05), z: 8 + 12.5 * Math.sin(1.05), a: 1.05 }; // the Terrace's open outer rim, south-east (below its branches): where she steps off (and flies back on)

// ---- shapes ----
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

const byId = Object.fromEntries([...TRUNK, ...BRANCH].map(r => [r.id, r]));
// a room: a lumpy blob (its radius wobbling with the angle and a little noise, so no two are round)
function blob(r, x, z) { const dx = x - r.x, dz = z - r.z, a = Math.atan2(dz, dx), seed = r.x * .37 + r.z * .21;

}
// a limb's distance sampled finely (thin twigs come out as beads at limb()'s 24 samples); l: { a, b, bend, w0, w1 }
function limbFine(l, x, z) {

  const nx = -ez / L, nz = ex / L, cx = (a.x + b.x) / 2 + nx * l.bend * 2, cz = (a.z + b.z) / 2 + nz * l.bend * 2, n = Math.ceil(L * 3);

    if (d < best) { best = d; bt = t; const tx = 2 * (1 - t) * (cx - a.x) + 2 * t * (b.x - cx), tz = 2 * (1 - t) * (cz - a.z) + 2 * t * (b.z - cz); side = ((x - px) * -tz + (z - pz) * tx) / Math.hypot(tx, tz); } }

// ---- revision 4 (Ed, 2026-10-24): the plan as a tree's silhouette. Each branch room is a swelling along its limb, not its tip: the
// limb carries on out of the room's far side as bark (not floor), tapering and forking into twigs out under the crown; the room's floor
// bulges a little where it leaves (STUB). Below the Dining Room the trunk flares into roots; over the Turret it splits into its top limbs.
const BARK_LIMBS = [], STUB = [];
{ const H = (a, b) => hash(a * 1.37 + 3.1, b * .71 + 9.2), at = (p, a, len) => ({ x: p.x + Math.cos(a) * len, z: p.z + Math.sin(a) * len });
  const fork = (p, a, len, w0, w1, seed, depth) => { const b = at(p, a, len), l = { a: p, b, bend: (H(seed, 1) - .5) * 4, w0, w1 }; BARK_LIMBS.push(l);
    if (depth > 0) for (const s of [-1, 1]) fork(b, a + s * (.35 + H(seed, s + 2) * .4), len * (.55 + H(seed, s + 5) * .2), w1, Math.max(.2, w1 * .35), seed + s * 7, depth - 1);
    return l; };
  for (const r of BRANCH) { const p = byId[r.from], L = Math.hypot(r.x - p.x, r.z - p.z), nx = -(r.z - p.z) / L, nz = (r.x - p.x) / L;
    const cx = (p.x + r.x) / 2 + nx * r.bend * 2, cz = (p.z + r.z) / 2 + nz * r.bend * 2, a = Math.atan2(r.z - cz, r.x - cx), w = Math.max(2.8, r.r * .42);
    STUB.push({ a: r, b: at(r, a, r.r + 2.5), bend: 0, w0: w * .9, w1: 1.4 }); // (the floor's hint: a few metres, no path)
    const main = fork(r, a, r.r + 14 + H(r.x, 0) * 6, w * .85, 1.1, r.x, 2); // on out of its far side, forking twice to twigs
    fork(at(r, a, r.r + 5), a + (H(r.z, 1) < .5 ? -1 : 1) * (.8 + H(r.z, 2) * .3), 9 + H(r.z, 3) * 4, .8, .25, r.z, 1); }
  const D = byId.dining; // the trunk below the Dining Room, flaring into roots
  BARK_LIMBS.push({ a: D, b: { x: D.x - 1, z: D.z + D.r + 8 }, bend: .5, w0: D.r * .8, w1: D.r * .75, root: true });
  for (let i = 0; i < 5; i++) { const a = Math.PI / 2 + (i - 2) * .55 + (H(i, 9) - .5) * .25, o = at({ x: D.x - 1, z: D.z + D.r + 4 }, a, 6);
    const l = { a: o, b: at(o, a, 18 + H(i, 4) * 10), bend: (H(i, 5) - .5) * 5, w0: 3.6, w1: .8, root: true }; BARK_LIMBS.push(l);
    BARK_LIMBS.push({ a: at(o, a, 9), b: at(o, a + (i < 2 ? -.7 : .7), 18), bend: 1, w0: 1.4, w1: .3, root: true }); }

  for (const [k, a] of [[0, -Math.PI / 2 - .75], [1, -Math.PI / 2 + .05], [2, -Math.PI / 2 + .7]]) fork(T, a, 14 + H(k, 6) * 6, 3, .9, 40 + k, 1);

// the whole floor's distance (negative inside) and, for the grain, which part it's nearest and how far along
function field(x, z) {

  for (let i = 1; i < TRUNK.length; i++) { const a = TRUNK[i - 1], b = TRUNK[i], [s, t, side] = limb(a, b, (i % 2 ? 1 : -1) * 1, a.r * .82, b.r * .82, x, z); parts.push({ kind: "spine", s, side, t, a, b }); d = smin(d, s, 6); }

// ---- the grain: no planks, the tree's own wood ----
const WOOD = { // heartwood, polished: 4 tones, darkest first (the bold style's few tones a material, no anti-aliasing)
  floor: [[78, 46, 28], [104, 64, 38], [132, 84, 48], [158, 106, 62]],
  ring: [62, 36, 22], bark: [[38, 28, 22], [56, 40, 28], [78, 58, 40]], moss: [[46, 66, 38], [70, 96, 50]], night: [14, 20, 22], leaf: [[22, 38, 30], [30, 52, 38]],
  locked: [[52, 40, 34], [64, 50, 40]],

// the grain coordinate: rings about the nearest trunk or branch room's heart, long grain along limbs, weighted by nearness so they flow
function grain(x, z, parts) {

    if (p.kind === "ring") v = Math.hypot(x - p.r.x, VIEW === "plan" ? (z - p.r.z) / FORE : z - p.r.z) * 1.1 + 1.0 * Math.sin(Math.atan2(z - p.r.z, x - p.r.x) * 3 + p.r.x);
    else v = p.side * 1.3 + 1.0 * Math.sin(p.t * 9 + (p.r ? p.r.x : p.a.x)); // (lines along the limb)

  if (lockedRoom) return WOOD.locked[(hash(Math.floor(x * PPM), Math.floor(z * PPM)) < .5) ? 0 : 1];

// ---- drawing ----
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function render({ x0, x1, z0, z1, scale, walls = true, labels = true, furniture = true, grid = false, title = "", view = "plan" }) {

  const W = Math.round((x1 - x0) * PPM), H = Math.round((z1 - z0) * PPM * ZK), WALL = Math.round(2.2 * PPM * (view === "game" ? Math.cos(24 * Math.PI / 180) : 1)); // a wall's height as drawn (m tilted)
  const img = new ImageData(W, H), inside = new Uint8Array(W * H), dist = new Float32Array(W * H);

    } else if (f.d > -.45) { // the rim: bark, mossy on top

  if (walls) for (let i = 0; i < W; i++) for (let j = 1; j < H; j++) {
    const k = j * W + i; if (!(inside[k] && !inside[k - W])) continue; // (outside above, inside here: a north edge)
    const x = x0 + (i + .5) / PPM, z = z0 + (j + .5) / (PPM * ZK), rm = roomAt(x, z + .6); if (!rm || TAKEOFF_OPEN(x, z)) continue;
