<!-- The loading screen, a mock (Ed, 2026-10-26): the starscape; the Ent's sigil (art/sigils.js WORLD_TREE) as a constellation in
     the middle, "COVEN" in star-letters round its top and "RUSH" round its bottom, a seal; no bar: every star is the progress, lit
     in a random order weighted toward the seal's edge (the middle last, the very last star the one nearest its centre), the faint
     dotted lines (as the telescope's constellations: render/sky.ts) only between two lit stars. Then the hand-over to the asleep card.
       ?p=0..1      the load's progress (the stars lit); none: a loop
       ?edge=1.0    the weighting toward the edge (0: plain random; the knob loadingScreen.edgeFirst)
       ?ghost=0.34 how bright an unlit star is (0: none; it shows the seal's shape faintly from the start)
       ?hand=0..1   the hand-over: the last star's supernova to white by .45 (?nova), the white clearing over .35 (?clear) onto her bedroom, its alarm ringing
       ?extra=1     extra stars along the letters' long strokes (on by default; 0: their corners and ends only)
       ?t=          the clock (seconds): where the camera's orbit is, for a still
       ?font=Great Vibes  the script for the words; ?spacing=6.5 its stars apart (px at 190 px); ?wordh=0.0019 the words' size
       ?galaxy=1    the galaxy under the seal (0 none)
       ?tilt=0.68   how far the seal lies back (radians; 0 upright, as before)
       ?orbit=0.1 ?dolly=0.12 ?dome=0.18 ?jitter=0.025   the 3D: the camera's sway (radians), how much nearer it comes as the
                    seal completes, the seal's dome (its middle toward us) and each star's own depth off it (0 for all: flat as before) -->
