     the middle, "COVEN" in star-letters round its top and "RUSH" round its bottom, a seal; no bar: every star is the progress, lit
     in a random order weighted toward the seal's edge (the middle last, the very last star the one nearest its centre), the faint
     dotted lines (as the telescope's constellations: render/sky.ts) only between two lit stars. Then the hand-over to the asleep card.
       ?p=0..1      the load's progress (the stars lit); none: a loop
       ?edge=1.0    the weighting toward the edge (0: plain random; the knob loadingScreen.edgeFirst)
       ?ghost=0.34 how bright an unlit star is (0: none; it shows the seal's shape faintly from the start)
       ?hand=0..1   the hand-over: 0 the seal complete, .35 its flare, .7 faded to dark, 1 the asleep card

function starAt(x, y, kind, merge) {

{ let seed = 20261026; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

let W = 0, H = 0, u = 3, bg = [];
function fit() {

function draw(t, p, hand) {

    const halo = s.kind === "sigil" ? "125,255,206" : "255,214,140"; // (the sigil's mint, its island's neon; the letters' gold)
    px(X, Y, core);
    const arm = (0.45 + 0.55 * Math.max(fresh, flare)) * fade;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) px(X + dx, Y + dy, `rgba(${halo},${(arm * 0.55).toFixed(2)})`);
    if (fresh > 0 || flare > 0) for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) px(X + dx, Y + dy, `rgba(${halo},${(Math.max(fresh, flare) * 0.35 * fade).toFixed(2)})`);
  }
  // the hand-over: the seal flares as it completes, fades, and the asleep card (render/wakeUp.ts WakeCard.sleep) is what's left
  veil.style.opacity = hand > 0.35 ? Math.min(1, (hand - 0.35) / 0.35).toFixed(2) : "0";

}
fit(); addEventListener("resize", fit);
const fixedP = P.has("p") ? num("p", 0) : null, fixedH = num("hand", 0), t0 = performance.now();
(function loop(now) {

})(t0);

</script>
