<!doctype html>
<html><head><meta charset="utf-8"><title>Opening mock</title>
<style>
  body { margin: 0; width: 1600px; height: 900px; background: #0d0c14; color: #e9e2f6; font: 15px/1.35 "DejaVu Sans", sans-serif; overflow: hidden; }
  header { position: absolute; left: 24px; top: 14px; right: 24px; }
  header .n { color: #f2c25c; font-weight: 700; font-size: 15px; letter-spacing: .04em; }
  header h1 { margin: 2px 0 0; font-size: 26px; color: #fff3d6; }
  header .t { position: absolute; right: 0; top: 4px; text-align: right; font-size: 14px; color: #b9b0cf; }
  header .t b { display: block; font-size: 22px; color: #f2c25c; }
  #scene { position: absolute; left: 24px; top: 96px; width: 1120px; height: 630px; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 0 0 1px #2c2840; }
  aside { position: absolute; left: 1164px; top: 96px; width: 412px; height: 630px; display: flex; flex-direction: column; gap: 12px; }
  .box { border-radius: 8px; padding: 10px 14px; background: #17152199; box-shadow: inset 0 0 0 1px #2c2840; }
  .box h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  .box ul { margin: 0; padding-left: 18px; } .box li { margin: 3px 0; }
  .play h2 { color: #5fd99a; } .shown h2 { color: #8fc3f5; } .load h2 { color: #f2c25c; }
  .load .bar { height: 8px; border-radius: 4px; background: #2c2840; margin: 6px 0 2px; overflow: hidden; } .load .bar i { display: block; height: 100%; background: #f2c25c; }
  .note { font-size: 13px; color: #b9b0cf; }
  footer { position: absolute; left: 24px; right: 24px; top: 744px; }
  footer .lane { position: relative; height: 30px; margin-bottom: 6px; }
  footer .lab { position: absolute; left: 0; width: 120px; top: 7px; font-size: 12px; color: #b9b0cf; text-transform: uppercase; letter-spacing: .05em; }
  footer .seg { position: absolute; top: 0; height: 30px; border-radius: 5px; font-size: 12px; line-height: 24px; padding: 3px 6px; white-space: nowrap; box-sizing: border-box; overflow: hidden; color: #14121b; font-weight: 700; }
  footer .seg.now { outline: 3px solid #fff; outline-offset: 1px; }
  footer .axis { position: relative; height: 18px; font-size: 11px; color: #8d86a6; }
  footer .axis span { position: absolute; top: 0; }
  .key { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 4px; background: #f3e8ff; color: #1a1426; font-weight: 700; font-size: 12px; text-align: center; box-shadow: 0 2px 0 #9c8fb8; }
</style></head>
<body>
<header><div class="n" id="num"></div><h1 id="title"></h1><div class="t" id="time"></div></header>
<canvas id="scene" width="1120" height="630"></canvas>
<aside>
  <div class="box play"><h2>▶ Playable</h2><ul id="play"></ul></div>
  <div class="box shown"><h2>👁 Shown</h2><ul id="shown"></ul></div>
  <div class="box load"><h2>⏳ Loading behind it</h2><ul id="load"></ul></div>
  <div class="note" id="note"></div>
</aside>
<footer id="foot"></footer>
<script type="module" src="./main.js"></script>
</body></html>
