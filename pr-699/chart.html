<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060e">
  <title>Sea Chart</title>
  <!-- The sea chart (wave 2, part C; Ed, docs/backlog/journey.md "The world and the sea chart"), in 3D as the game is drawn
       (Ed, 2026-10-11): the world's disc of night sea, home in the middle, every island round it; choose one and the view glides
       to it; sail to it (?island=<kind>). The scene: src/render/chart/seaChart.ts; the page: src/app/chartPage.ts. -->
  <style>
    :root { --ink: #e8e2f4; --dim: #9a93b4; --panel: rgba(10, 9, 22, .78); --accent: #e8b46a; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060e; color: var(--ink); font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; touch-action: none; }
    #chart { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
    .top { position: fixed; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 16px 8px; text-align: center; pointer-events: none; background: linear-gradient(#05060ecc, #05060e00); }
    h1 { margin: 0; font-size: 16px; letter-spacing: .14em; }
    #status { color: var(--dim); font-size: 12px; min-height: 1.4em; }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .bottom > * { pointer-events: auto; }
    #card { background: var(--panel); border: 1px solid #3a2f5c; border-radius: 8px; padding: 8px 14px; min-width: min(320px, 100%); max-width: 100%; box-sizing: border-box; text-align: center; }
    #name { font-size: 16px; font-weight: bold; }
    #phase, #state { color: var(--dim); font-size: 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button, a.btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid #3a2f5c; border-radius: 6px; padding: 8px 14px; min-height: 36px; box-sizing: border-box; cursor: pointer; text-decoration: none; }
    button:hover, a.btn:hover, button:focus-visible, a.btn:focus-visible { border-color: var(--accent); outline: none; }
    #sail { border-color: var(--accent); color: var(--accent); margin-top: 6px; display: inline-block; }
    #sail[hidden] { display: none; }
    #hint, #world { color: var(--dim); font-size: 11px; text-align: center; }
    #new-world { align-items: center; background: var(--panel); border: 1px solid #3a2f5c; border-radius: 8px; padding: 8px 10px; }
    #new-world[hidden] { display: none; }
    #new-seed { font: inherit; font-size: 13px; color: var(--ink); background: #14112a; border: 1px solid #3a2f5c; border-radius: 6px; padding: 8px; width: 14em; max-width: 50vw; }
  </style>
  <script type="module" crossorigin src="./assets/chart-DKjXuoIJ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/chartSave-msnD9OOh.js">
</head>
<body>
  <canvas id="chart" aria-label="The sea chart"></canvas>
  <div class="top"><h1>THE SEA CHART</h1><div id="status"></div></div>
  <div class="bottom">
    <div id="card" hidden><div id="name"></div><div id="phase"></div><div id="state"></div><a class="btn" id="sail" href="./?island=home">Sail there</a></div>
    <div class="bar"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><a class="btn" id="home" href="./?island=home">Sail home</a><button id="start-over">Start over</button></div>
    <div id="new-world" class="bar" hidden><label for="new-seed">New world's seed</label><input id="new-seed" placeholder="blank: a random one" autocomplete="off"><button id="new-go">Start</button><button id="new-cancel">Cancel</button></div>
    <div id="world"></div>
    <div id="hint">Tap an island to look at it, again to sail · arrows / stick to choose, Enter / A to sail · sigils: islands you can sail to · gold rings: won</div>
  </div>
</body>
</html>
