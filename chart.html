<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a16">
  <title>Sea Chart</title>
  <!-- The sea chart (wave 2, part C; Ed, docs/backlog/journey.md "The world and the sea chart"): a bare page for now (not the
       treehouse yet). Home in the middle, the islands found round it at their kinds' bearings, click one to sail there. -->
  <style>
    :root { --ink: #e8e2f4; --dim: #9a93b4; --panel: rgba(14, 11, 28, .82); --accent: #e8b46a; --sea: #10183a; --sea2: #0c1230; --rim: #2a3c78; }
    html, body { margin: 0; min-height: 100%; background: #0b0a16; color: var(--ink); font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    main { max-width: 900px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    h1 { margin: 0; font-size: 18px; letter-spacing: .12em; }
    #status { color: var(--dim); font-size: 13px; text-align: center; min-height: 1.4em; }
    #chart { width: min(92vw, 78vh, 820px); height: auto; aspect-ratio: 1; display: block; }
    #chart .island { cursor: pointer; }
    #chart .island:hover .land, #chart .island:focus .land { stroke: var(--accent); stroke-width: .008; }
    #chart .island:focus { outline: none; }
    #chart image { image-rendering: pixelated; image-rendering: crisp-edges; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button, a.btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid #3a2f5c; border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
    button:hover, a.btn:hover { border-color: var(--accent); }
    #legend, #world { color: var(--dim); font-size: 12px; text-align: center; }
    #new-world { align-items: center; }
    #new-world[hidden] { display: none; }
    #new-seed { font: inherit; font-size: 13px; color: var(--ink); background: #14112a; border: 1px solid #3a2f5c; border-radius: 6px; padding: 6px 8px; width: 14em; }
  </style>
</head>
<body>
  <main>
    <h1>THE SEA CHART</h1>
    <div id="status"></div>
    <svg id="chart" viewBox="-1.04 -1.04 2.08 2.08" role="img" aria-label="The sea chart"></svg>
    <div id="legend">Sigils: islands you can sail to (wake a legend to find its island) · ✦ won · dotted lines: your voyages</div>
    <div class="bar"><a class="btn" id="home" href="./?island=home">Sail home</a><button id="start-over">Start over</button></div>
    <div id="world"></div>
    <div id="new-world" class="bar" hidden><label for="new-seed">New world's seed</label><input id="new-seed" placeholder="blank: a random one" autocomplete="off"><button id="new-go">Start</button><button id="new-cancel">Cancel</button></div>
  </main>
  <script type="module" src="/src/app/chartPage.ts"></script>
</body>
</html>
